<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#101418">
<title>Entreno</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<script src="/vendor/xlsx.full.min.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#101418; --surface:#171C22; --surface2:#1E242B; --line:#2B333C;
  --text:#EDF1F3; --muted:#8C98A3; --faint:#5C6773;
  --pesas:#E8A33D; --running:#FF7A59; --bici:#45C8A0; --natacion:#4FA8E8; --libre:#A98BE8;
  --danger:#E8574A; --ok:#45C8A0;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.45; overflow-x:hidden;
  padding-bottom:calc(92px + var(--safe-b));
  overflow-wrap:break-word;
}
.wrap{max-width:560px;margin:0 auto;padding:0 clamp(13px,4vw,20px)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:10px;
  padding:11px 12px; width:100%; max-width:100%; min-width:0; color:var(--text); outline:none;
  min-height:46px;
}
textarea{min-height:76px}
input:focus,select,textarea:focus{border-color:var(--accent,#4FA8E8)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent,#4FA8E8);outline-offset:2px}
input[type="date"]{
  appearance:none;-webkit-appearance:none;
  min-height:46px;line-height:1.2;text-align:left;
  display:flex;align-items:center;
}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.55;margin-left:auto;padding:0}
input[type="date"]::-webkit-datetime-edit{padding:0}

/* campo de tiempo: horas / minutos / segundos */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tin{text-align:center;font-weight:700;font-size:17px;padding:12px 4px;font-variant-numeric:tabular-nums}
.tcap{text-align:center;font-size:11px;color:var(--faint);margin-top:4px}
.paceout{font-size:13.5px;color:var(--muted);margin-top:-2px}
.paceout b{color:var(--text);font-variant-numeric:tabular-nums}

select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- header ---------- */
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 0 10px;display:flex;align-items:center;gap:6px}
header .htext{min-width:0;flex:1}
#back{
  width:38px;height:38px;margin-left:-8px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
#back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:clamp(23px,6.4vw,27px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}

/* ---------- tab bar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--bg);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
  display:flex;
  transform:translateZ(0);          /* capa propia: evita el arrastre al hacer scroll */
  -webkit-transform:translateZ(0);
  will-change:transform;
  contain:layout paint;
  transition:transform .18s ease;
}
/* con el teclado abierto la barra estorba: se retira */
html.kb nav{transform:translateY(110%)}
html.kb body{padding-bottom:24px}
@media (prefers-reduced-motion:reduce){nav{transition:none}}
nav button{flex:1;min-width:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:clamp(9.5px,2.7vw,11px);font-weight:600;white-space:nowrap}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--text)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3.6vw,15px);min-width:0}
.card + .card{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.grow{flex:1;min-width:0}
.btn{
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px clamp(10px,3vw,16px);font-weight:650;font-size:clamp(14px,3.9vw,15px);
  text-align:center;min-width:0;
}
.btn.primary{background:var(--accent,#E8A33D);border-color:transparent;color:#101418}
.btn.wide{display:block;width:100%}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:9px;white-space:nowrap}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.985)}
.label{font-size:12.5px;color:var(--muted);margin-bottom:5px;display:block}
.field + .field{margin-top:11px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.empty{color:var(--muted);text-align:center;padding:34px 18px;font-size:14.5px;line-height:1.6}
.hr{height:1px;background:var(--line);margin:13px 0}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.01em}

/* modality chips */
.mods{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);
}
.chip.on{color:#101418;border-color:transparent}

/* modality picker cards */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.pick button{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:clamp(15px,4.4vw,19px) clamp(12px,3.6vw,15px);text-align:left;position:relative;overflow:hidden;min-width:0;
}
.pick button .ico{font-size:26px;line-height:1;display:block;margin-bottom:9px}
.pick button .nm{font-weight:700;font-size:clamp(15px,4.2vw,16.5px);letter-spacing:-.01em}
.pick button .dt{font-size:12px;color:var(--muted);margin-top:2px}
.pick button::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--c)}
.pick .full{grid-column:1/-1}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(148px,46%),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px clamp(11px,3.4vw,15px);min-width:0}
.kpi .v{font-size:clamp(20px,6.2vw,27px);font-weight:800;letter-spacing:-.03em;line-height:1.15;overflow-wrap:anywhere}
.kpi .k{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .d{font-size:11.5px;margin-top:5px;color:var(--faint)}

/* diario */
.day{margin-top:18px}
.day h3{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:7px}
.sesh{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:12px 13px;margin-bottom:8px}
.sesh .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sesh .t .nm{min-width:0}
.sesh .nm{font-weight:700;font-size:15.5px}
.sesh .mt{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}

/* sets */
.setrow{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center;margin-top:7px}
.setrow .n{font-size:12.5px;color:var(--faint);text-align:center;font-weight:700}
.setrow input{padding:11px 4px;text-align:center;font-weight:650}

/* una serie con lado izquierdo y derecho */
.setrow.uni{grid-template-columns:20px minmax(0,1fr) 30px;align-items:center}
.sides{display:grid;gap:6px;min-width:0}
.side{display:grid;grid-template-columns:15px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.sl{font-size:11px;color:var(--faint);font-weight:800;text-align:center}
.unibtn{font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:8px;white-space:nowrap}
.unibtn.on{color:#101418;background:var(--pesas);border-color:transparent}
.x{color:var(--faint);font-size:19px;padding:6px;line-height:1}

/* exercise block */
.exblk{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.exblk .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exblk .hd .nm{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.mini{font-size:12px;color:var(--faint);text-align:center;font-weight:600}
.minis{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;margin-top:9px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(6,9,12,.7);z-index:80;display:none}
.veil.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--bg);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  max-height:min(88vh,88dvh);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px clamp(13px,4vw,20px) calc(34px + var(--safe-b));
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  max-width:560px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.sheet .bar{width:38px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 14px}
.sheetx{
  position:absolute;top:10px;right:14px;width:34px;height:34px;border-radius:50%;
  background:var(--surface2);color:var(--muted);font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sheet{position:fixed}
.sheet h2{font-size:19px;font-weight:750;letter-spacing:-.015em;margin-bottom:12px;padding-right:44px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,10px);
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:10px 16px;font-size:13.5px;font-weight:600;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* list item */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;text-align:left}
.li:last-child{border-bottom:none}
.li .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.li .gp{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.li > div{min-width:0}

canvas{width:100%;display:block}
.hide{display:none!important}
.optbtn{font-size:13.5px;color:var(--muted);font-weight:600;padding:9px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="back" class="hide" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="htext">
      <h1 id="hTitle">Entreno</h1>
      <div class="sub" id="hSub"></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav id="nav">
  <button data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Entrenar</button>
  <button data-tab="diario"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Diario</button>
  <button data-tab="metricas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Métricas</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M12 3a4.2 4.2 0 0 0-4.2 4.2c0 1.7 1 2.7 1.6 3.7.5.8.6 1.4.6 2.1h4c0-.7.1-1.3.6-2.1.6-1 1.6-2 1.6-3.7A4.2 4.2 0 0 0 12 3Z"/><path d="M10 17h4M10.5 20h3"/></svg>Coach</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>Ajustes</button>
</nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="/catalog.js"></script>
<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
